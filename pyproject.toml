[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyhedonic"
version = "0.1.0"
description = "Tools for experimenting with fractional hedonic games."
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"

dependencies = [
  "numpy",
  "numba",
  "pydot",
  "pandas",
  "tabulate",
  "networkx",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
